name: SonarQube Scan

on:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Sonar Coverage Inputs
    runs-on: ubuntu-latest
    env:
      REVAER_TEST_DATABASE_URL: "postgres://revaer:${{ format('{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }}@localhost:5432/revaer"
      DATABASE_URL: "postgres://revaer:${{ format('{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }}@localhost:5432/revaer"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: "${{ format('{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }}"
          POSTGRES_DB: revaer
        options: >-
          --shm-size=1g
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=1g
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          node-version: 24.14.1
          apt-profile: coverage

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.REVAER_TEST_DATABASE_URL }}
        run: just db-migrate

      - name: Build combined LCOV report
        run: just cov

      - name: Run Playwright with JavaScript coverage
        env:
          E2E_API_BASE_URL: http://localhost:7070
          E2E_BASE_URL: http://localhost:8080
          E2E_DB_ADMIN_URL: "postgres://revaer:${{ format('{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }}@localhost:5432/postgres"
          E2E_SKIP_DB_START: "1"
        run: just ui-e2e

      - name: Release JavaScript coverage
        run: just js-release-coverage

      - name: Merge JavaScript coverage inputs
        run: just js-coverage-merge

      - name: Build native compile database
        run: just sonar-compile-db

      - name: Verify Sonar analysis inputs
        run: just sonar-verify-inputs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-coverage
          path: |
            coverage/lcov.info
            coverage/js-lcov.info
            coverage/js/playwright/lcov.info
            coverage/script-coverage.xml
            coverage/compile_commands.json
            coverage/cxxbridge/include/rust/cxx.h
            coverage/cxxbridge/include/revaer-torrent-libt/src/ffi/bridge.rs.h
          if-no-files-found: error

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy,llvm-tools-preview
          apt-packages: libtorrent-rasterbar-dev
          cargo-cache: "false"

      - name: Prepare Sonar SCM context
        run: |
          set -euo pipefail

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --prune --unshallow origin
          fi
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git show-ref --verify --quiet refs/remotes/origin/main

      - name: Download Sonar coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
          path: coverage

      - name: Verify Sonar analysis inputs
        run: just sonar-verify-inputs

      - name: Remove untracked dependency installs before analysis
        run: just sonar-prepare-sources

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN }}

      - name: Verify Sonar published result
        env:
          SONAR_AUTH_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN }}
          SONAR_PROJECT_KEY: VannaDii_Revaer
        run: just sonar-verify-result

      - name: Package Sonar analysis evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f .scannerwork/report-task.txt ]; then
            exit 0
          fi
          test -d .scannerwork/scanner-report
          tar -cJf .scannerwork/scanner-report.tar.xz -C .scannerwork scanner-report
          test -s .scannerwork/scanner-report.tar.xz
          tar -tf .scannerwork/scanner-report.tar.xz > .scannerwork/scanner-report.entries
          grep -q '^scanner-report/' .scannerwork/scanner-report.entries

      - name: Upload Sonar analysis evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-analysis-evidence
          path: |
            .scannerwork/report-task.txt
            .scannerwork/scanner-report.tar.xz
          if-no-files-found: error
