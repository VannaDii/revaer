[[bans.skip]]
crate = "rand@0.9.5"
reason = "ADR 321: opentelemetry uses rand 0.9 while workspace token generation and sqlx-postgres use rand 0.10."

[[bans.skip]]
crate = "rand_core@0.6.4"
reason = "ADR 321: argon2/password-hash use rand_core 0.6 while opentelemetry and rand 0.10 use newer rand_core lines."

[[bans.skip]]
crate = "rand_core@0.9.5"
reason = "ADR 321: opentelemetry uses rand_core 0.9 while workspace token generation and sqlx-postgres use rand_core 0.10."

[[bans.skip]]
crate = "syn@2.0.119"
reason = "ADR 321: yew-macro uses syn 3 while current macro dependencies retain syn 2."

[[bans.skip]]
crate = "http@0.2.12"
reason = "Legacy gloo-net depends on http 0.2; allow alongside http 1.x."


[[bans.skip]]
crate = "thiserror@1.0.69"
reason = "Prometheus/protobuf pin the 1.x line."

[[bans.skip]]
crate = "thiserror-impl@1.0.69"
reason = "Matches thiserror 1.x pinned by prometheus/protobuf."

