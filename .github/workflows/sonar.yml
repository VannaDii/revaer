name: SonarQube Scan

on:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.19.0"

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REVAER_TEST_DATABASE_URL: ${{ vars.REVAER_DATABASE_URL }}
      DATABASE_URL: ${{ vars.REVAER_DATABASE_URL }}
      SONAR_AUTH_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN }}
      REVAER_REQUIRE_NATIVE_COVERAGE: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: revaer
          POSTGRES_DB: revaer
        options: >-
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          apt-profile: coverage
          node-version: ${{ env.NODE_VERSION }}
          sonar-scanner: "true"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.REVAER_TEST_DATABASE_URL }}
        run: just db-migrate

      - name: Coverage
        run: just cov

      - name: Run Playwright with JavaScript coverage
        env:
          E2E_API_BASE_URL: http://localhost:7070
          E2E_BASE_URL: http://localhost:8080
          E2E_DB_ADMIN_URL: postgres://revaer:revaer@localhost:5432/postgres
          E2E_SKIP_DB_START: "1"
        run: just ui-e2e

      - name: Release JavaScript coverage
        run: just js-release-coverage

      - name: Merge JavaScript coverage inputs
        run: just js-coverage-merge

      - name: Build native compile database
        run: just sonar-compile-db

      - name: Verify Sonar analysis inputs
        run: just sonar-verify-inputs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-coverage
          path: |
            coverage/lcov.info
            coverage/llvm-cov.txt
            coverage/js-lcov.info
            coverage/script-coverage.xml
            coverage/compile_commands.json
            coverage/cxxbridge/include/rust/cxx.h
            coverage/cxxbridge/include/revaer-torrent-libt/src/ffi/bridge.rs.h
          if-no-files-found: error

      - name: Remove untracked dependency installs before analysis
        run: just sonar-prepare-sources

      - name: Prepare exact Sonar SCM context
        env:
          SONAR_BASE_SHA: ${{ github.event.before }}
          SONAR_BASE_REF: main
          SONAR_HEAD_SHA: ${{ github.sha }}
        run: just sonar-prepare-scm

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ env.SONAR_AUTH_TOKEN }}
        run: just sonar-scan

      - name: Package Sonar analysis evidence
        run: just sonar-package-report

      - name: Verify Sonar published result
        env:
          SONAR_PROJECT_KEY: VannaDii_Revaer
        run: just sonar-verify-result

      - name: Upload Sonar analysis evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-analysis-evidence
          path: |
            artifacts/sonar/scanner.log
            artifacts/sonar/scm-evidence.txt
            .scannerwork/report-task.txt
            .scannerwork/scanner-report.tar.xz
            artifacts/sonar/api/*.json
            coverage/llvm-cov.txt
          if-no-files-found: error
