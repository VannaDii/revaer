name: Build Images

on:
  workflow_call:
    inputs:
      matrix:
        description: Build matrix JSON.
        required: true
        type: string
      image_name:
        description: Base image name.
        required: true
        type: string
      version_tag:
        description: Version tag to apply.
        required: true
        type: string
      alias_tag:
        description: Optional alias tag.
        required: false
        type: string
        default: ""
      include_sha_tag:
        description: Whether to tag the manifest with the short SHA.
        required: false
        type: boolean
        default: true
      publish_dev_helm:
        description: Whether to publish a PR-scoped dev Helm chart after the multi-arch manifest succeeds.
        required: false
        type: boolean
        default: false
      pr_number:
        description: Pull request number used to derive the dev Helm chart version.
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Optional git ref to checkout.
        required: false
        type: string
        default: ""
      final_image_compliance_bundle:
        description: Final-image compliance bundle path required before publishing images.
        required: false
        type: string
        default: ""
    secrets:
      HELM_GPG_PRIVATE:
        required: false
      HELM_GPG_PUBLIC:
        required: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up QEMU
        if: matrix.needs_qemu == true
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: inputs.final_image_compliance_bundle != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        if: inputs.final_image_compliance_bundle != ''
        id: build_image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH_TAG: ${{ matrix.arch_tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: just image-build-push

      - name: Validate supplied compliance authorization against built digest
        if: inputs.final_image_compliance_bundle != ''
        env:
          FINAL_IMAGE_COMPLIANCE_BUNDLE: ${{ inputs.final_image_compliance_bundle }}
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
        run: |
          set -euo pipefail
          just image-compliance-validate \
            "${FINAL_IMAGE_COMPLIANCE_BUNDLE}" "${IMAGE_REFERENCE}"

      - name: Build Image (verification only)
        if: inputs.final_image_compliance_bundle == ''
        id: verify_image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH_TAG: ${{ matrix.arch_tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: just image-build-verify

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3
          cache: "true"

      - name: Inventory digest-qualified image
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
          IMAGE_SOURCE: remote
          PLATFORM: ${{ matrix.platform }}
          TRIVY_OUTPUT_PATH: image-package-inventory.spdx.json
        run: just image-inventory

      - name: Scan digest-qualified image
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
          IMAGE_SOURCE: remote
          PLATFORM: ${{ matrix.platform }}
        run: just image-scan

      - name: Scan verification image
        if: inputs.final_image_compliance_bundle == ''
        env:
          IMAGE_REFERENCE: ${{ steps.verify_image.outputs.image_tag }}
          IMAGE_SOURCE: docker
          PLATFORM: ${{ matrix.platform }}
        run: just image-scan

      - name: Verify HIGH and CRITICAL findings
        run: just trivy-sarif-verify trivy-results.sarif

      - name: Resolve code scanning category
        if: always()
        id: code-scanning-category
        env:
          ARCH_TAG: ${{ matrix.arch_tag }}
          MATRIX_NAME: ${{ matrix.name }}
          NEEDS_QEMU: ${{ matrix.needs_qemu && 'true' || '' }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER: ${{ matrix.runner }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          category=".github/workflows/ci.yml:build-images/arch_tag:${ARCH_TAG}/name:${MATRIX_NAME}/needs_qemu:${NEEDS_QEMU}/platform:${PLATFORM}/runner:${RUNNER}/rust_target:${RUST_TARGET}"
          printf 'value=%s\n' "${category}" >> "${GITHUB_OUTPUT}"

      - name: Upload scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-results.sarif
          category: ${{ steps.code-scanning-category.outputs.value }}

      - name: Install Cosign
        if: inputs.final_image_compliance_bundle != ''
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Generate digest-bound compliance evidence
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
        run: |
          set -euo pipefail
          just image-compliance-generate \
            "${IMAGE_REFERENCE}" \
            image-package-inventory.spdx.json \
            image-compliance

      - name: Validate digest-bound compliance evidence
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
        run: |
          set -euo pipefail
          just image-compliance-validate \
            image-compliance/final-image-compliance-bundle.json \
            "${IMAGE_REFERENCE}"

      - name: Sign image and compliance evidence
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
          COMPLIANCE_PREDICATE: image-compliance/final-image-compliance-bundle.json
        run: just image-sign-attest

      - name: Verify signed compliance evidence
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_REFERENCE: ${{ steps.build_image.outputs.image_reference }}
          ATTESTATION_OUTPUT: image-compliance/verified-attestation.json
        run: just image-attestation-verify

      - name: Upload compliance evidence
        if: inputs.final_image_compliance_bundle != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-compliance-${{ matrix.arch_tag }}
          path: image-compliance
          if-no-files-found: error
          retention-days: 30

  create-manifest:
    name: Manifest
    if: inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: inputs.final_image_compliance_bundle != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: inputs.final_image_compliance_bundle != ''
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: just image-manifest-create

      - name: Verify multi-arch manifest inputs
        if: inputs.final_image_compliance_bundle == ''
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: just image-manifest-verify

      - name: Install Cosign
        if: inputs.final_image_compliance_bundle != ''
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign multi-arch tags
        if: inputs.final_image_compliance_bundle != ''
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: just image-manifest-sign

  publish-dev-helm:
    name: Helm Chart
    if: inputs.publish_dev_helm && (inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: create-manifest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: 1.3.1

      - name: Resolve Helm versions
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "Missing pr_number for PR-scoped dev Helm publish." >&2
            exit 1
          fi

          case "${PR_NUMBER}" in
            (*[!0-9]*)
              echo "Invalid pr_number: expected a numeric pull request number." >&2
              exit 1
              ;;
          esac

          git_sha_short="$(git rev-parse --short HEAD)"
          chart_version="0.0.0-dev.pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          app_version="pr-${PR_NUMBER}-${git_sha_short}"

          {
            echo "RELEASE_VERSION<<EOF"
            echo "${chart_version}"
            echo "EOF"
            echo "RELEASE_TAG<<EOF"
            echo "${app_version}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Package Helm chart
        if: inputs.final_image_compliance_bundle != ''
        env:
          HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
          HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_NAME: ${{ vars.ARTIFACTHUB_OWNER_NAME }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          just helm-package "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Package Helm chart (verification only)
        if: inputs.final_image_compliance_bundle == ''
        env:
          REVAER_HELM_SIGN: "0"
        run: |
          set -euo pipefail
          just helm-package "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Publish dev Helm chart
        if: inputs.final_image_compliance_bundle != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REVAER_HELM_SKIP_PACKAGE: "1"
        run: |
          set -euo pipefail
          just helm-publish "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Verify packaged Helm chart without publishing
        if: inputs.final_image_compliance_bundle == ''
        run: |
          set -euo pipefail
          test -f "dist/helm/revaer-${RELEASE_VERSION}.tgz"
          test -f "dist/helm/artifacthub-repo.yml"
