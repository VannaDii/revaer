name: docs

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up documentation tools
        uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          cargo-tools: mdbook,mdbook-mermaid,lychee

      - name: Build Docs
        run: uv run --locked -- rv docs-build

      - name: Generate LLM manifests
        run: uv run --locked -- rv docs-index

      - name: Guardrails
        run: uv run --locked -- rv docs-guard

      - name: Link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --locked -- rv docs-link-check

      - name: Prepare Deployment
        id: deployment
        run: uv run --locked -- rv docs-prepare

      # Transport the already prepared payload; project behavior lives in rv.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy
          enable_jekyll: false
          commit_message: |
            docs: deploy documentation

            Source commit: ${{ steps.deployment.outputs.sha }}
            Workflow run: ${{ github.run_id }}
            Generated: ${{ steps.deployment.outputs.generated_at }}
            Trigger: ${{ github.event_name }}
