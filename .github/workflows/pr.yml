name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "lts/*"
  IMAGE_NAME: revaer

jobs:
  instruction-drift:
    name: Check Instruction Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          cargo-cache: "false"

      - name: Instruction drift
        env:
          REVAER_INSTRUCTION_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          REVAER_INSTRUCTION_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: just instruction-drift

  # Quick formatting check that can run in parallel
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt
          cargo-cache: "false"

      - name: Format
        run: just fmt

  lint:
    name: Check Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          components: clippy
          cargo-cache: "false"

      - name: Lint
        run: just lint

  check:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          cargo-cache: "false"

      - name: Check
        run: just check

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          cargo-cache: "false"

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Helm lint
        run: just helm-lint

  coverage:
    name: Check Coverage
    runs-on: ubuntu-latest
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    permissions:
      contents: read
    env:
      REVAER_TEST_DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
      DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: revaer
          POSTGRES_DB: revaer
        options: >-
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=1g
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          apt-profile: db

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.REVAER_TEST_DATABASE_URL }}
        run: just db-migrate

      - name: Reclaim coverage runner disk
        run: |
          set -euo pipefail

          df -h /

          cleanup_paths=(
            /usr/share/dotnet
            /usr/local/lib/android
            /opt/ghc
            /usr/local/share/boost
          )
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            cleanup_paths+=("${AGENT_TOOLSDIRECTORY}")
          fi

          for cleanup_path in "${cleanup_paths[@]}"; do
            if [ -e "${cleanup_path}" ]; then
              sudo rm -rf "${cleanup_path}"
            fi
          done

          df -h /

      - name: Coverage
        run: just cov

      - name: Release JavaScript coverage
        run: just js-release-coverage

      - name: Build native compile database
        run: just sonar-compile-db

      - name: Verify Sonar analysis inputs
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          test -s coverage/js/release/lcov.info
          test -s coverage/compile_commands.json
          test -s coverage/cxxbridge/include/rust/cxx.h
          test -s coverage/cxxbridge/include/revaer-torrent-libt/src/ffi/bridge.rs.h
          grep -q '^SF:' coverage/lcov.info
          grep -q '^DA:' coverage/lcov.info
          grep -q '^SF:' coverage/js/release/lcov.info
          grep -q '^DA:' coverage/js/release/lcov.info
          grep -q '"file":' coverage/compile_commands.json
          grep -q 'coverage/cxxbridge/include' coverage/compile_commands.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-coverage
          path: |
            coverage/lcov.info
            coverage/js/release/lcov.info
            coverage/compile_commands.json
            coverage/cxxbridge/include/rust/cxx.h
            coverage/cxxbridge/include/revaer-torrent-libt/src/ffi/bridge.rs.h
          if-no-files-found: error

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [coverage, ui-e2e-coverage]
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_AUTH_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy,llvm-tools-preview
          apt-packages: libtorrent-rasterbar-dev
          cargo-cache: "false"

      - name: Prepare Sonar SCM context
        env:
          SONAR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SONAR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -z "${SONAR_BASE_REF}" ]; then
            echo "Missing Sonar base ref" >&2
            exit 1
          fi
          if [ -z "${SONAR_BASE_SHA}" ]; then
            echo "Missing Sonar base SHA" >&2
            exit 1
          fi
          git check-ref-format --branch "${SONAR_BASE_REF}" >/dev/null

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --prune --unshallow origin
          fi
          git fetch --no-tags --prune origin "+refs/heads/${SONAR_BASE_REF}:refs/remotes/origin/${SONAR_BASE_REF}"
          git show-ref --verify --quiet "refs/remotes/origin/${SONAR_BASE_REF}"
          actual_base_sha="$(git rev-parse "refs/remotes/origin/${SONAR_BASE_REF}")"
          if [ "${actual_base_sha}" != "${SONAR_BASE_SHA}" ]; then
            echo "Sonar base ref ${SONAR_BASE_REF} resolved to ${actual_base_sha}, expected ${SONAR_BASE_SHA}" >&2
            exit 1
          fi

      - name: Download Sonar coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
          path: coverage

      - name: Download UI JavaScript coverage inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-js-coverage-shard-*
          path: coverage/js
          merge-multiple: true

      - name: Merge JavaScript coverage inputs
        run: just js-coverage-merge

      - name: Verify Sonar analysis inputs
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          test -s coverage/js-lcov.info
          test -s coverage/compile_commands.json
          test -s coverage/cxxbridge/include/rust/cxx.h
          test -s coverage/cxxbridge/include/revaer-torrent-libt/src/ffi/bridge.rs.h
          grep -q '^SF:' coverage/lcov.info
          grep -q '^DA:' coverage/lcov.info
          grep -q '^SF:' coverage/js-lcov.info
          grep -q '^DA:' coverage/js-lcov.info
          grep -q '"file":' coverage/compile_commands.json
          grep -q 'coverage/cxxbridge/include' coverage/compile_commands.json

      - name: Require Sonar token
        if: github.event.pull_request.head.repo.fork == false
        run: test -n "${SONAR_AUTH_TOKEN}"

      - name: SonarQube scan
        if: github.event.pull_request.head.repo.fork == false && env.SONAR_AUTH_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_AUTH_TOKEN }}

      - name: Verify Sonar published result
        if: github.event.pull_request.head.repo.fork == false && env.SONAR_AUTH_TOKEN != ''
        env:
          SONAR_PROJECT_KEY: VannaDii_Revaer
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: just sonar-verify-result

      - name: Package Sonar analysis evidence
        if: always() && github.event.pull_request.head.repo.fork == false && env.SONAR_AUTH_TOKEN != ''
        run: just sonar-package-report

      - name: Upload Sonar analysis evidence
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonar-analysis-evidence
          path: |
            .scannerwork/report-task.txt
            .scannerwork/scanner-report.tar.xz
          if-no-files-found: error

  native-it:
    name: Native Integration Tests
    runs-on: ubuntu-latest
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    env:
      REVAER_NATIVE_IT: "1"
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          apt-profile: base

      - name: Native integration tests
        run: just test-native

  media-conversion:
    name: Media Conversion Fixtures
    runs-on: ubuntu-latest
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          cargo-cache: "false"
          apt-packages: >-
            coreutils
            curl
            ffmpeg
            git
            pkg-config
            sccache

      - id: media-tools
        name: Media tool cache key
        shell: bash
        run: |
          set -euo pipefail
          {
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          } | sha256sum | awk '{ print "key=" $1 }' >> "${GITHUB_OUTPUT}"

      - name: Restore media fixture cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            test-fixtures/source
            test-fixtures/matroska
            test-fixtures/chromium
            test-fixtures/derived
          key: ${{ runner.os }}-media-fixtures-${{ steps.media-tools.outputs.key }}-${{ hashFiles('test-fixtures/manifest.json', 'scripts/test-fixtures/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-media-fixtures-${{ steps.media-tools.outputs.key }}-

      - name: Prepare media fixtures
        run: |
          just download-test-fixtures
          just generate-test-fixtures

      - name: Verify media fixtures
        run: just verify-test-fixtures

      - name: Media conversion integration tests
        run: just test-media-conversion

      - name: Publish media conversion report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_path="target/media-conversion-report.md"
          if [ ! -f "${report_path}" ]; then
            {
              echo "# Media Conversion Fixture Report"
              echo
              echo "## Summary"
              echo "- Outcome: failed"
              echo "- Report file missing: ${report_path}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          cat "${report_path}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload media conversion report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: media-conversion-report
          path: target/media-conversion-report.md
          if-no-files-found: error

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    env:
      REVAER_TEST_DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
      DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: revaer
          POSTGRES_DB: revaer
        options: >-
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=1g
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          apt-profile: db

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.REVAER_TEST_DATABASE_URL }}
        run: just db-migrate

      - name: Feature matrix tests (no default features)
        run: just test-features-min

  ui-e2e:
    name: UI E2E (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    env:
      E2E_API_BASE_URL: http://localhost:7070
      E2E_BASE_URL: http://localhost:8080
      E2E_BROWSER_CHANNEL: chrome
      E2E_PLAYWRIGHT_NO_DEPS: "1"
      E2E_PLAYWRIGHT_PROJECTS: ui-chromium
      E2E_SKIP_DB_START: "1"
      E2E_VIDEO: "off"
      REVAER_TEST_DB_USER: revaer
      REVAER_TEST_DB_PASSWORD: revaer
      REVAER_TEST_DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
      DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
      PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
      PLAYWRIGHT_SHARD_TOTAL: 3
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: revaer
          POSTGRES_DB: revaer
        options: >-
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=1g
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          apt-profile: db

      - name: Configure UI E2E database URL
        shell: bash
        run: |
          set -euo pipefail
          printf 'E2E_DB_ADMIN_URL=postgres://%s:%s@localhost:5432/postgres\n' \
            "${REVAER_TEST_DB_USER}" \
            "${REVAER_TEST_DB_PASSWORD}" >> "${GITHUB_ENV}"

      - name: UI E2E
        env:
          JS_COVERAGE_DIR: coverage/js/ui-${{ matrix.shard }}
        run: just ui-e2e

      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-e2e-coverage-shard-${{ matrix.shard }}
          path: |
            tests/test-results/api-coverage-*.json
            tests/test-results/ui-coverage-*.json
          if-no-files-found: warn

      - name: Upload UI JavaScript coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-js-coverage-shard-${{ matrix.shard }}
          path: coverage/js/ui-${{ matrix.shard }}/lcov.info
          if-no-files-found: error

  api-e2e:
    name: API E2E Coverage
    runs-on: ubuntu-latest
    needs: [fmt, lint, check, helm-lint, supply-chain, load-matrix, instruction-drift]
    env:
      E2E_API_BASE_URL: http://localhost:7070
      E2E_BASE_URL: http://localhost:8080
      E2E_COVERAGE_REQUIRE_UI: "0"
      E2E_PLAYWRIGHT_PROJECTS: api-api-key
      E2E_SKIP_DB_START: "1"
      E2E_VIDEO: "off"
      REVAER_TEST_DB_USER: revaer
      REVAER_TEST_DB_PASSWORD: revaer
      REVAER_TEST_DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
      DATABASE_URL: ${{ vars.REVAER_DATABASE_URL}}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: revaer
          POSTGRES_DB: revaer
        options: >-
          --health-cmd="pg_isready -U revaer -d revaer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=1g
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          apt-profile: db

      - name: Configure API E2E database URL
        shell: bash
        run: |
          set -euo pipefail
          printf 'E2E_DB_ADMIN_URL=postgres://%s:%s@localhost:5432/postgres\n' \
            "${REVAER_TEST_DB_USER}" \
            "${REVAER_TEST_DB_PASSWORD}" >> "${GITHUB_ENV}"

      - name: API E2E coverage
        env:
          JS_COVERAGE_DIR: coverage/js/api
        run: just ui-e2e

      - name: Upload API E2E coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: api-e2e-coverage
          path: tests/test-results/api-coverage-*.json
          if-no-files-found: error

  ui-e2e-coverage:
    name: UI E2E Coverage
    runs-on: ubuntu-latest
    needs: [api-e2e, ui-e2e, feature-matrix, native-it, coverage]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Download API E2E coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-e2e-coverage
          path: tests/test-results

      - name: Download E2E coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-e2e-coverage-shard-*
          path: tests/test-results
          merge-multiple: true

      - name: UI E2E coverage
        run: just ui-e2e-coverage

  load-matrix:
    name: Load Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: out
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "matrix<<EOF"
            cat .github/matrices/build-images.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-pr-images:
    name: Images
    needs: [ui-e2e, feature-matrix, native-it, media-conversion, coverage, sonar, load-matrix]
    if: github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      matrix: ${{ needs.load-matrix.outputs.matrix }}
      image_name: revaer
      version_tag: pr-${{ github.event.pull_request.number }}-${{ needs.load-matrix.outputs.short_sha }}
      alias_tag: pr-${{ github.event.pull_request.number }}
      include_sha_tag: false
      publish_dev_helm: true
      pr_number: ${{ github.event.pull_request.number }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
      HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}

  supply-chain:
    name: Supply Chain Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          cargo-cache: "false"

      - name: Restore Cargo supply-chain tool cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-udeps
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-supply-chain-tools-audit-0.22.0-deny-0.18.9-udeps-0.1.57

      - name: Restore Cargo advisory cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-advisory-db-${{ hashFiles('Cargo.lock', 'deny.toml', '.secignore') }}
          restore-keys: |
            ${{ runner.os }}-cargo-advisory-db-

      - name: Install supply-chain cargo tools
        uses: taiki-e/install-action@cf39a74df4a72510be4e5b63348d61067f11e64a # v2.75.0
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.18.9,cargo-udeps@0.1.57

      - name: Audit
        run: just audit

      - name: Deny
        run: just deny

      - name: Unused Deps
        run: just udeps

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [ui-e2e, feature-matrix, native-it, media-conversion, coverage, sonar]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}
          apt-profile: base

      - name: Build release
        run: just build-release
