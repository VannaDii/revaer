# Processes isolate environment, working directory and global Rust state.
# Resource groups additionally limit shared external services.
nextest-version = "0.9.148"

[profile.default]
retries = 0

[test-groups]
database = { max-threads = 2 }
native = { max-threads = 1 }
recovery = { max-threads = 2 }

# These real-process fixtures assert millisecond deadlines and TERM grace.
# Reserve the runner while they execute so unrelated spawns cannot consume
# the fixture's startup budget before its shell installs its signal handler.
[[profile.default.overrides]]
filter = '''
package(revaer-media-runtime) & (
    test(process::tests::deadline_includes_pipe_setup_time)
    | test(process::tests::term_grace_precedes_force_kill_for_uncooperative_process)
)
'''
threads-required = "num-test-threads"
priority = 10

[[profile.default.overrides]]
filter = 'package(revaer-app) & test(bootstrap::service_recovery_tests::native_service_recovery_)'
test-group = 'recovery'
priority = 10

[[profile.default.overrides]]
filter = 'package(revaer-torrent-libt) | (package(revaer-app) & test(bootstrap::runtime_tests))'
test-group = 'native'

[[profile.default.overrides]]
filter = '''
package(revaer-data) | package(revaer-config) | package(revaer-test-support)
| (package(revaer-fsops) & test(service::))
| (package(revaer-runtime) & (test(media::) | test(runtime::)))
| (package(revaer-app) & (
    test(bootstrap::) | test(media_discovery_runtime::) | test(media::)
    | test(media_job_runtime::) | test(import_job_runtime::) | test(indexers::)
    | test(rss_poll::) | test(cardigann::tests::runtime::) | test(manual_search::tests::)
    | test(handle_event_persists_runtime_status_updates)
    | test(handle_event_removes_runtime_status_after_torrent_removed)
))
'''
test-group = 'database'
