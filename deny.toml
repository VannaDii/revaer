# cargo-deny configuration aligned with the Phase One licensing policy.

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT-0",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "getrandom@0.2.17"
reason = "ADR 321: gloo/ring/rand_core retain getrandom 0.2 while jsonschema/tempfile and sqlx use newer getrandom lines."

[[bans.skip]]
crate = "getrandom@0.3.4"
reason = "ADR 321: jsonschema/tempfile/opentelemetry use getrandom 0.3 while workspace rand and sqlx-postgres use getrandom 0.4."

[[bans.skip]]
crate = "r-efi@5.3.0"
reason = "ADR 321: getrandom 0.3 and 0.4 target different WASI support stacks until upstream converges."

[[bans.skip]]
crate = "hashbrown@0.16.1"
reason = "ADR 321: hashlink/referencing/sqlx use hashbrown 0.16 while indexmap remains on hashbrown 0.17."

[[bans.skip]]
crate = "block-buffer@0.10.4"
reason = "ADR 321: argon2/headers/sqlx-core use digest 0.10 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "cpufeatures@0.2.17"
reason = "ADR 321: digest 0.10 consumers remain on cpufeatures 0.2 while rand/sqlx-postgres use cpufeatures 0.3."

[[bans.skip]]
crate = "crypto-common@0.1.7"
reason = "ADR 321: digest 0.10 consumers remain on crypto-common 0.1 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "digest@0.10.7"
reason = "ADR 321: argon2/headers/sqlx-core use digest 0.10 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "sha2@0.10.9"
