name: Helm OCI Verify

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: Optional chart version override for manual verification.
        required: false
        type: string
      app_version:
        description: Optional app version override for manual verification.
        required: false
        type: string

concurrency:
  group: helm-oci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-helm-oci:
    name: Verify Helm OCI Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up chart tools
        uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
          apt-packages: gnupg
          helm: "true"
          oras: "true"

      - name: Resolve verification versions
        id: versions
        env:
          INPUT_CHART_VERSION: ${{ inputs.chart_version }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run --locked -- rv workflow-chart-versions
          --chart-version "$INPUT_CHART_VERSION"
          --app-version "$INPUT_APP_VERSION"

      - name: Package Helm chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
          HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_NAME: ${{ vars.ARTIFACTHUB_OWNER_NAME }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: uv run --locked -- rv helm-package "$CHART_VERSION" "$APP_VERSION"

      # Publication consumes the exact signed package from the previous step.
      - name: Publish Helm chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked -- rv helm-publish "$CHART_VERSION" "$APP_VERSION"
