name: Postgres admin credential drift
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REVAER_TEST_DATABASE_URL: postgres://revaer:ephemeral@localhost:5432/revaer
      DATABASE_URL: postgres://revaer:ephemeral@localhost:5432/revaer
      E2E_DB_ADMIN_URL: postgres://revaer:wrong@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revaer
          POSTGRES_PASSWORD: ephemeral
          POSTGRES_DB: revaer
    steps:
      - run: just check
