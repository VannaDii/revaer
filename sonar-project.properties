# SonarCloud strict analysis scope.
# Every tracked top-level repository entry remains in main-code scope. Empty filters below clear
# project-side narrowing; they do not suppress files. The empty .sonar-test-scope sentinel disables
# path heuristics without classifying authored tests or documentation outside the main-code gate.

sonar.projectKey=VannaDii_Revaer
sonar.organization=vannadii
sonar.sourceEncoding=UTF-8
sonar.scanner.excludeHiddenFiles=false
sonar.text.activate=true
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*
sonar.html.file.suffixes=.html
sonar.tsql.file.suffixes=.tsql
sonar.plsql.file.suffixes=.plsql
sonar.plsql.defaultSchema=public
sonar.featureflag.cloud-security-enable-generic-yaml-and-json-analyzer=true
sonar.yaml.activate=true
sonar.json.activate=true
sonar.lang.patterns.kubernetes=charts/revaer/templates/deployment.yaml,charts/revaer/templates/ingress.yaml,charts/revaer/templates/pvc-config.yaml,charts/revaer/templates/pvc-data.yaml,charts/revaer/templates/secret.yaml,charts/revaer/templates/service.yaml,charts/revaer/templates/serviceaccount.yaml
sonar.lang.patterns.yaml=.github/actions/setup-revaer/action.yml,.github/workflows/build-images.yml,.github/workflows/ci.yml,.github/workflows/docs.yml,.github/workflows/helm-oci-verify.yml,.github/workflows/pr.yml,.github/workflows/sonar.yml,charts/revaer/Chart.yaml,charts/revaer/artifacthub-repo.yml,charts/revaer/values.yaml,trivy.yaml,vendor/yewdux/.github/workflows/deploy.yml

sonar.sources=.cargo,.clippy.toml,.dockerignore,.editorconfig,.env.example,.github,.gitignore,.secignore,AGENTS.md,Cargo.lock,Cargo.toml,DASHBOARD_UI_CHECKLIST.md,Dockerfile,ERD_INDEXERS.md,ERD_INDEXERS_CHECKLIST.md,MEDIA_TRANSCODING.md,PRD_REVAER_OVERVIEW.md,README.md,REMEDIATION_PLAN.md,charts,codealike.json,config,crates,deny.toml,docs,justfile,release,revaer-logo.svg,rust-toolchain.toml,scripts,sonar-project.properties,test-fixtures,tests,trivy.yaml,vendor
sonar.scm.exclusions.disabled=true
sonar.scm.disabled=false
sonar.scm.provider=git
sonar.scm.forceReloadAll=true
sonar.sensor.cache.project.enable=true
sonar.scanner.keepReport=true
sonar.exclusions=
sonar.inclusions=
sonar.tests=.sonar-test-scope
sonar.test.exclusions=
sonar.test.inclusions=
sonar.coverage.exclusions=
sonar.cpd.exclusions=
sonar.issue.ignore.multicriteria=
sonar.issue.ignore.allfile=
sonar.issue.ignore.block=
sonar.issue.enforce.multicriteria=

sonar.filesize.limit=100
sonar.javascript.exclusions=
sonar.javascript.maxFileSize=10000
sonar.javascript.detectBundles=false

sonar.sca.enabled=true
sonar.sca.exclusions=
sonar.sca.allowManifestFailures=false
sonar.sca.goNoResolve=false
sonar.sca.mavenNoResolve=false
sonar.sca.gradleNoResolve=false
sonar.sca.pythonNoResolve=false
sonar.sca.npmNoResolve=false
sonar.sca.nugetNoResolve=false
sonar.sca.cfamily=true
sonar.sca.sbomImportPaths=release/media-compliance/media-runtime-inventory.spdx.json

sonar.rust.clippy.enabled=true
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/js-lcov.info
sonar.coverageReportPaths=coverage/script-coverage.xml
sonar.cfamily.compile-commands=coverage/compile_commands.json
sonar.cfamily.llvm-cov.reportPath=coverage/llvm-cov.txt
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
