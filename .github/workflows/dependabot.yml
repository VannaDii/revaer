name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: [PR]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Request protected Dependabot auto-merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes trusted default-branch code. Never check out a PR head.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
      - name: Create repository-scoped merge token
        id: merge-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVAER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVAER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Request protected auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: uv run --locked --no-build -- rv dependabot-auto-merge
