name: Setup Revaer
description: Install the locked Python tooling and the selected native prerequisites.
inputs:
  profile:
    description: rv setup profile (ci installs Rust; python is for Python-only jobs).
    default: ci
  cargo-tools:
    description: Comma-separated package names from tools/versions.toml; empty installs none.
    default: ""
  browsers:
    description: Comma-separated Playwright browsers (chromium, firefox, webkit, chrome); empty installs none.
    default: ""
  apt-profile:
    description: Optional Debian package set (base, db, coverage, media).
    default: ""
  apt-packages:
    description: Optional whitespace-separated Debian packages, overriding apt-profile.
    default: ""
  cargo-cache:
    description: Restore and save Cargo tools, downloads and compiler artifacts.
    default: "true"
  helm:
    description: Install the supported Helm CLI.
    default: "false"
  oras:
    description: Install the supported ORAS CLI.
    default: "false"
  trivy:
    description: Install the supported Trivy CLI.
    default: "false"
  sonar-scanner:
    description: Install the pinned scanner and retain its analyzer cache.
    default: "false"
runs:
  using: composite
  steps:
    # setup-uv reads tool.uv.required-version and owns Python/cache installation.
    # The checkout's .python-version and uv.lock select the interpreter and graph.
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version-file: pyproject.toml
        enable-cache: "true"
        cache-python: "true"
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          .python-version
          tools/launcher/pyproject.toml

    - name: Sync locked Python environment
      shell: bash
      run: uv sync --locked

    - name: Cache Rust artifacts and installed tools
      if: inputs.cargo-cache == 'true'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cargo/bin/cargo-audit
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-llvm-cov
          ~/.cargo/bin/cargo-udeps
          ~/.cargo/bin/cargo-sqlx
          ~/.cargo/bin/sqlx
          ~/.cargo/bin/trunk
          ~/.cargo/bin/mdbook
          ~/.cargo/bin/mdbook-mermaid
          ~/.cargo/bin/lychee
          ~/.cache/sccache
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/versions.toml', '.github/build-inputs.env') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-

    - name: Install Helm
      if: inputs.helm == 'true'
      uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.19.0

    - name: Install ORAS
      if: inputs.oras == 'true'
      uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
      with:
        version: 1.3.1

    - name: Install Trivy
      if: inputs.trivy == 'true'
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.69.3
        cache: "true"

    - name: Set up selected Revaer tools
      shell: bash
      env:
        RV_SETUP_PROFILE: ${{ inputs.profile }}
        RV_SETUP_CARGO_TOOLS: ${{ inputs.cargo-tools }}
        RV_SETUP_BROWSERS: ${{ inputs.browsers }}
        RV_SETUP_APT_PROFILE: ${{ inputs.apt-profile }}
        RV_SETUP_APT_PACKAGES: ${{ inputs.apt-packages }}
      run: >-
        uv run --locked -- rv setup --no-launcher
        --profile "$RV_SETUP_PROFILE"
        --cargo-tools "$RV_SETUP_CARGO_TOOLS"
        --browsers "$RV_SETUP_BROWSERS"
        --apt-profile "$RV_SETUP_APT_PROFILE"
        --apt-packages "$RV_SETUP_APT_PACKAGES"

    - name: Cache pinned kcov source and installation
      if: inputs.apt-profile == 'coverage'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.local/revaer/kcov
        key: ${{ runner.os }}-${{ runner.arch }}-kcov-${{ hashFiles('tools/versions.toml') }}

    - name: Install pinned kcov
      if: inputs.apt-profile == 'coverage'
      shell: bash
      run: uv run --locked -- rv setup --profile python --no-launcher --kcov

    - name: Cache scanner and analyzers
      if: inputs.sonar-scanner == 'true'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.local/revaer/sonar-scanner
          ~/.sonar/cache
        key: ${{ runner.os }}-${{ runner.arch }}-sonar-${{ hashFiles('tools/versions.toml', 'config/sonarsource-public-key.asc') }}

    - name: Install pinned Sonar scanner
      if: inputs.sonar-scanner == 'true'
      shell: bash
      run: uv run --locked -- rv setup --profile python --no-launcher --sonar-scanner
