name: Build Images

on:
  workflow_call:
    inputs:
      matrix:
        description: Build matrix JSON.
        required: true
        type: string
      image_name:
        description: Base image name.
        required: true
        type: string
      version_tag:
        description: Version tag to apply.
        required: true
        type: string
      alias_tag:
        description: Optional alias tag.
        required: false
        type: string
        default: ""
      include_sha_tag:
        description: Whether to tag the manifest with the short SHA.
        required: false
        type: boolean
        default: true
      publish_dev_helm:
        description: Whether to publish a PR-scoped dev Helm chart after the multi-arch manifest succeeds.
        required: false
        type: boolean
        default: false
      pr_number:
        description: Pull request number used to derive the dev Helm chart version.
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Optional git ref to checkout.
        required: false
        type: string
        default: ""
      final_image_compliance_bundle:
        description: Final-image compliance bundle path required before publishing images.
        required: false
        type: string
        default: ""
    secrets:
      HELM_GPG_PRIVATE:
        required: false
      HELM_GPG_PUBLIC:
        required: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Set up QEMU
        if: matrix.needs_qemu == true
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Validate final-image compliance bundle
        if: inputs.final_image_compliance_bundle != ''
        env:
          FINAL_IMAGE_COMPLIANCE_BUNDLE: ${{ inputs.final_image_compliance_bundle }}
        run: |
          set -euo pipefail
          if [ -z "${FINAL_IMAGE_COMPLIANCE_BUNDLE}" ]; then
            echo "final_image_compliance_bundle is required before image publication." >&2
            exit 1
          fi
          if [ ! -f "${FINAL_IMAGE_COMPLIANCE_BUNDLE}" ]; then
            echo "Missing final-image compliance bundle: ${FINAL_IMAGE_COMPLIANCE_BUNDLE}" >&2
            exit 1
          fi
          scripts/validate-final-image-compliance-bundle.sh "${FINAL_IMAGE_COMPLIANCE_BUNDLE}"

      - name: Log in to GHCR
        if: inputs.final_image_compliance_bundle != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        if: inputs.final_image_compliance_bundle != ''
        id: build_image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH_TAG: ${{ matrix.arch_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          GIT_SHA_SHORT=$(git rev-parse --short HEAD)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"
          IMAGE_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}-${ARCH_TAG}"
          RUST_TARGET="${{ matrix.rust_target }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REVISION="${GIT_SHA_SHORT}"

          echo "Building ${IMAGE_TAG} for ${PLATFORM}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

          docker buildx build \
            --platform "${PLATFORM}" \
            -t "${IMAGE_TAG}" \
            --push \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --build-arg RUST_TARGET="${RUST_TARGET}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VERSION="${VERSION_TAG}" \
            --build-arg REVISION="${REVISION}" \
            .

      - name: Build Image (verification only)
        if: inputs.final_image_compliance_bundle == ''
        id: verify_image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH_TAG: ${{ matrix.arch_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_NAME}:verify-${ARCH_TAG}"
          RUST_TARGET="${{ matrix.rust_target }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REVISION=$(git rev-parse --short HEAD)

          echo "Building verification image ${IMAGE_TAG} for ${PLATFORM}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

          docker buildx build \
            --platform "${PLATFORM}" \
            -t "${IMAGE_TAG}" \
            --load \
            --build-arg RUST_TARGET="${RUST_TARGET}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VERSION="${VERSION_TAG}" \
            --build-arg REVISION="${REVISION}" \
            .

      - name: Scan pushed image
        if: inputs.final_image_compliance_bundle != ''
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.build_image.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Scan verification image
        if: inputs.final_image_compliance_bundle == ''
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IMAGE_SRC: docker
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.verify_image.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Resolve code scanning category
        id: code-scanning-category
        env:
          ARCH_TAG: ${{ matrix.arch_tag }}
          MATRIX_NAME: ${{ matrix.name }}
          NEEDS_QEMU: ${{ matrix.needs_qemu && 'true' || '' }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER: ${{ matrix.runner }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          category=".github/workflows/ci.yml:build-images/arch_tag:${ARCH_TAG}/name:${MATRIX_NAME}/needs_qemu:${NEEDS_QEMU}/platform:${PLATFORM}/runner:${RUNNER}/rust_target:${RUST_TARGET}"
          printf 'value=%s\n' "${category}" >> "${GITHUB_OUTPUT}"

      - name: Upload scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-results.sarif
          category: ${{ steps.code-scanning-category.outputs.value }}

      - name: Install Cosign
        if: inputs.final_image_compliance_bundle != ''
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign pushed image
        if: inputs.final_image_compliance_bundle != ''
        run: cosign sign --yes "${{ steps.build_image.outputs.image_tag }}"

  create-manifest:
    name: Manifest
    if: inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: inputs.final_image_compliance_bundle != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: |
          set -euo pipefail

          GIT_SHA_SHORT=$(git rev-parse --short HEAD)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          AMD64_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}-amd64"
          ARM64_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}-arm64"

          SHA_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}"
          VERSION_TAG="${IMAGE_BASE}:${VERSION_TAG}"

          echo "Will create multi-arch manifest for:"
          echo "  ${VERSION_TAG}"

          TAG_ARGS="-t ${VERSION_TAG}"
          if [ -n "${ALIAS_TAG}" ]; then
            ALIAS_TAG="${IMAGE_BASE}:${ALIAS_TAG}"
            TAG_ARGS="${TAG_ARGS} -t ${ALIAS_TAG}"
            echo "  ${ALIAS_TAG}"
          fi

          if [ "${INCLUDE_SHA_TAG}" = "true" ]; then
            TAG_ARGS="${TAG_ARGS} -t ${SHA_TAG}"
            echo "  ${SHA_TAG}"
          fi

          echo "Using:"
          echo "  ${AMD64_TAG}"
          echo "  ${ARM64_TAG}"

          docker buildx imagetools create \
            ${TAG_ARGS} \
            "${AMD64_TAG}" \
            "${ARM64_TAG}"

      - name: Verify multi-arch manifest inputs
        if: inputs.final_image_compliance_bundle == ''
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: |
          set -euo pipefail

          GIT_SHA_SHORT=$(git rev-parse --short HEAD)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          AMD64_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}-amd64"
          ARM64_TAG="${IMAGE_BASE}:${GIT_SHA_SHORT}-arm64"
          VERSION_REF="${IMAGE_BASE}:${VERSION_TAG}"

          if [ -z "${VERSION_TAG}" ]; then
            echo "version_tag is required for image manifest verification." >&2
            exit 1
          fi

          echo "Verified manifest inputs without publishing:"
          echo "  ${VERSION_REF}"
          if [ -n "${ALIAS_TAG}" ]; then
            echo "  ${IMAGE_BASE}:${ALIAS_TAG}"
          fi
          if [ "${INCLUDE_SHA_TAG}" = "true" ]; then
            echo "  ${IMAGE_BASE}:${GIT_SHA_SHORT}"
          fi
          echo "  ${AMD64_TAG}"
          echo "  ${ARM64_TAG}"

      - name: Install Cosign
        if: inputs.final_image_compliance_bundle != ''
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign multi-arch tags
        if: inputs.final_image_compliance_bundle != ''
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          ALIAS_TAG: ${{ inputs.alias_tag }}
          INCLUDE_SHA_TAG: ${{ inputs.include_sha_tag }}
        run: |
          set -euo pipefail

          GIT_SHA_SHORT=$(git rev-parse --short HEAD)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          TAGS=("${IMAGE_BASE}:${VERSION_TAG}")
          if [ -n "${ALIAS_TAG}" ]; then
            TAGS+=("${IMAGE_BASE}:${ALIAS_TAG}")
          fi
          if [ "${INCLUDE_SHA_TAG}" = "true" ]; then
            TAGS+=("${IMAGE_BASE}:${GIT_SHA_SHORT}")
          fi

          for tag in "${TAGS[@]}"; do
            cosign sign --yes "${tag}"
          done

  publish-dev-helm:
    name: Helm Chart
    if: inputs.publish_dev_helm && (inputs.final_image_compliance_bundle != '' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    needs: create-manifest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - uses: ./.github/actions/setup-revaer
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN_VERSION }}

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: 1.3.1

      - name: Resolve Helm versions
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "Missing pr_number for PR-scoped dev Helm publish." >&2
            exit 1
          fi

          case "${PR_NUMBER}" in
            (*[!0-9]*)
              echo "Invalid pr_number: expected a numeric pull request number." >&2
              exit 1
              ;;
          esac

          git_sha_short="$(git rev-parse --short HEAD)"
          chart_version="0.0.0-dev.pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          app_version="pr-${PR_NUMBER}-${git_sha_short}"

          {
            echo "RELEASE_VERSION<<EOF"
            echo "${chart_version}"
            echo "EOF"
            echo "RELEASE_TAG<<EOF"
            echo "${app_version}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Package Helm chart
        if: inputs.final_image_compliance_bundle != ''
        env:
          HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
          HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_NAME: ${{ vars.ARTIFACTHUB_OWNER_NAME }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          just helm-package "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Package Helm chart (verification only)
        if: inputs.final_image_compliance_bundle == ''
        env:
          REVAER_HELM_SIGN: "0"
        run: |
          set -euo pipefail
          just helm-package "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Publish dev Helm chart
        if: inputs.final_image_compliance_bundle != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REVAER_HELM_SKIP_PACKAGE: "1"
        run: |
          set -euo pipefail
          just helm-publish "${RELEASE_VERSION}" "${RELEASE_TAG}"

      - name: Verify packaged Helm chart without publishing
        if: inputs.final_image_compliance_bundle == ''
        run: |
          set -euo pipefail
          test -f "dist/helm/revaer-${RELEASE_VERSION}.tgz"
          test -f "dist/helm/artifacthub-repo.yml"
