name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: revaer

jobs:
  build-release:
    name: Build Release
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          apt-profile: base

      - name: Resolve source identity
        id: source
        run: uv run --locked -- rv workflow-metadata

      - name: Build release artifacts
        run: uv run --locked -- rv release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: revaer-release-${{ steps.source.outputs.short_sha }}
          path: dist
          if-no-files-found: error

  release-dev:
    name: Publish Dev Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build-release
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release-info.outputs.tag }}
      release_version: ${{ steps.release-info.outputs.version }}
      released: ${{ steps.release-info.outputs.released }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
          apt-packages: gnupg gh
          helm: "true"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revaer-release-${{ needs.build-release.outputs.short_sha }}
          path: dist

      - name: Publish dev release
        id: release-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVAER_ENABLE_HELM_RELEASE_ASSETS: "1"
          HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
          HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_NAME: ${{ vars.ARTIFACTHUB_OWNER_NAME }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: uv run --locked -- rv release publish

      - name: Upload Helm release assets
        if: steps.release-info.outputs.released == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: revaer-helm-${{ steps.release-info.outputs.tag }}
          path: dist/helm
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release-info.outputs.tag }}
      release_version: ${{ steps.release-info.outputs.version }}
      released: ${{ steps.release-info.outputs.released }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
          apt-packages: gnupg gh
          helm: "true"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revaer-release-${{ needs.build-release.outputs.short_sha }}
          path: dist

      - name: Publish stable release
        id: release-info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVAER_ENABLE_HELM_RELEASE_ASSETS: "1"
          HELM_GPG_PRIVATE: ${{ secrets.HELM_GPG_PRIVATE }}
          HELM_GPG_PUBLIC: ${{ secrets.HELM_GPG_PUBLIC }}
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          ARTIFACTHUB_OWNER_NAME: ${{ vars.ARTIFACTHUB_OWNER_NAME }}
          ARTIFACTHUB_OWNER_EMAIL: ${{ vars.ARTIFACTHUB_OWNER_EMAIL }}
        run: uv run --locked -- rv release publish --tag "$RELEASE_TAG"

      - name: Upload Helm release assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: revaer-helm-${{ steps.release-info.outputs.tag }}
          path: dist/helm
          if-no-files-found: error

  # Publication consumes the exact signed package emitted by the release job.
  # Signing material is not passed into these registry-only jobs.
  publish-dev-helm:
    name: Publish Dev Helm Chart
    if: github.ref == 'refs/heads/main' && needs.release-dev.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: release-dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
          apt-packages: gnupg
          helm: "true"
          oras: "true"

      - name: Download Helm release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revaer-helm-${{ needs.release-dev.outputs.release_tag }}
          path: dist/helm

      - name: Publish dev Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-dev.outputs.release_version }}
          RELEASE_TAG: ${{ needs.release-dev.outputs.release_tag }}
        run: uv run --locked -- rv helm-publish "$RELEASE_VERSION" "$RELEASE_TAG"

  publish-release-helm:
    name: Publish Release Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"
          apt-packages: gnupg
          helm: "true"
          oras: "true"

      - name: Download Helm release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revaer-helm-${{ needs.publish-release.outputs.release_tag }}
          path: dist/helm

      - name: Publish release Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish-release.outputs.release_version }}
          RELEASE_TAG: ${{ needs.publish-release.outputs.release_tag }}
        run: uv run --locked -- rv helm-publish "$RELEASE_VERSION" "$RELEASE_TAG"

  load-matrix:
    name: Load Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-release
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-revaer
        timeout-minutes: 20
        with:
          profile: python
          cargo-cache: "false"

      - name: Select release image matrix
        id: out
        run: uv run --locked -- rv workflow-matrix --release-only

  build-images-dev:
    name: Build Dev Images
    needs: [load-matrix, release-dev]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    if: github.ref == 'refs/heads/main' && needs.release-dev.result == 'success' && needs.release-dev.outputs.released == 'true' && needs.load-matrix.result == 'success'
    uses: ./.github/workflows/build-images.yml
    with:
      matrix: ${{ needs.load-matrix.outputs.matrix }}
      image_name: revaer
      version_tag: ${{ needs.release-dev.outputs.release_tag }}
      alias_tag: dev
      include_sha_tag: true

  # Stable tags never depend on the main-only prerelease job.
  build-images-release:
    name: Build Release Images
    needs: load-matrix
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && needs.load-matrix.result == 'success'
    uses: ./.github/workflows/build-images.yml
    with:
      matrix: ${{ needs.load-matrix.outputs.matrix }}
      image_name: revaer
      version_tag: ${{ github.ref_name }}
      alias_tag: latest
      include_sha_tag: true
