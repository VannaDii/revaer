# cargo-deny configuration aligned with the Phase One licensing policy.

[advisories]
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained; yew transitive, no alternative in current release line
    "RUSTSEC-2025-0141", # bincode unmaintained; transitive via gloo-worker in the UI stack
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT-0",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "getrandom@0.2.16"
reason = "ADR 321: rustls/ring still use getrandom 0.2 while rand/jsonschema/sqlx target newer getrandom lines."

[[bans.skip]]
crate = "getrandom@0.3.4"
reason = "ADR 321: jsonschema/tempfile/opentelemetry use getrandom 0.3 while workspace rand and sqlx-postgres use getrandom 0.4."

[[bans.skip]]
crate = "r-efi@5.3.0"
reason = "ADR 321: getrandom 0.3 and 0.4 target different WASI support stacks until upstream converges."

[[bans.skip]]
crate = "wit-bindgen@0.46.0"
reason = "ADR 321: getrandom 0.3 and 0.4 target different WASI support stacks until upstream converges."

[[bans.skip]]
crate = "block-buffer@0.10.4"
reason = "ADR 321: argon2/headers/sqlx-core use digest 0.10 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "cpufeatures@0.2.17"
reason = "ADR 321: digest 0.10 consumers remain on cpufeatures 0.2 while rand/sqlx-postgres use cpufeatures 0.3."

[[bans.skip]]
crate = "crypto-common@0.1.7"
reason = "ADR 321: digest 0.10 consumers remain on crypto-common 0.1 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "digest@0.10.7"
reason = "ADR 321: argon2/headers/sqlx-core use digest 0.10 while sqlx-postgres 0.9 uses digest 0.11."

[[bans.skip]]
crate = "sha2@0.10.9"
reason = "ADR 321: asset_sync/fsops/sqlx-core use sha2 0.10 while sqlx-postgres 0.9 uses sha2 0.11."

[[bans.skip]]
crate = "rand@0.9.4"
reason = "ADR 321: opentelemetry uses rand 0.9 while workspace token generation and sqlx-postgres use rand 0.10."

[[bans.skip]]
crate = "rand_core@0.6.4"
reason = "ADR 321: argon2/password-hash use rand_core 0.6 while opentelemetry and rand 0.10 use newer rand_core lines."

[[bans.skip]]
crate = "rand_core@0.9.3"
reason = "ADR 321: opentelemetry uses rand_core 0.9 while workspace token generation and sqlx-postgres use rand_core 0.10."


[[bans.skip]]
crate = "http@0.2.12"
reason = "Legacy gloo-net depends on http 0.2; allow alongside http 1.x."


[[bans.skip]]
crate = "syn@1.0.109"
reason = "proc-macro-error pulls syn 1.x; unavoidable via yew 0.21."

[[bans.skip]]
crate = "thiserror@1.0.69"
reason = "Prometheus/protobuf pin the 1.x line."

[[bans.skip]]
crate = "thiserror-impl@1.0.69"
reason = "Matches thiserror 1.x pinned by prometheus/protobuf."

[[bans.skip]]
crate = "windows-sys@*"
reason = "Tokio, sqlx, and rustls require multiple versions across their supported Windows targets."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
